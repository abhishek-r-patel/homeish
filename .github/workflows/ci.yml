name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - beta

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: cp .env.example .env.local
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run build
