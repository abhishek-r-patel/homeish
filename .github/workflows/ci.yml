name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - beta

permissions:
  contents: read
  pull-requests: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: cp .env.example .env.local
      - run: npm run check
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Disposable PostgreSQL that matches Supabase's major version. Tests add a stand-in for
    # Supabase's auth schema and roles; no real database credential exists in CI.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Apply migrations and run integration tests on disposable PostgreSQL 17
        run: npm run test:integration
        env:
          INTEGRATION_DATABASE_URL: postgres://supabase_admin@127.0.0.1:5432/postgres

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: cp .env.example .env.local
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The hosted Ubuntu image already has Chrome's system libraries, so skip --with-deps
      # and its slow apt download; cached browsers make this a no-op after the first run.
      - run: npx playwright install chromium
      - run: npm run e2e
