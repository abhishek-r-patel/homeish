name: Database Integrity

on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 1 * *'

permissions:
  contents: read

concurrency:
  group: database-integrity-testdb
  cancel-in-progress: false

jobs:
  testdb-integrity:
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/feature-build-1')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Confirm the connection targets homeish-testdb
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_TESTDB_URL }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const expectedProjectRef = 'oqyagsabodaueghtrocv';
          const value = process.env.SUPABASE_DB_URL;
          if (!value) {
            console.error('SUPABASE_TESTDB_URL is not configured.');
            process.exit(1);
          }
          let url;
          try {
            url = new URL(value);
          } catch {
            console.error('SUPABASE_TESTDB_URL is malformed.');
            process.exit(1);
          }
          const projectRef =
            url.hostname.match(/^db\.([^.]+)\.supabase\.co$/)?.[1] ??
            url.username.match(/^postgres\.([a-z0-9]+)$/i)?.[1];
          if (url.protocol !== 'postgresql:' || projectRef !== expectedProjectRef) {
            console.error('SUPABASE_TESTDB_URL does not target homeish-testdb.');
            process.exit(1);
          }
          console.info('Verified integrity-check source: homeish-testdb.');
          NODE
      - name: Run read-only database integrity checks
        run: npm run integrity:check
        env:
          NODE_USE_SYSTEM_CA: '1'
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_TESTDB_URL }}
